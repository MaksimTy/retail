[project]
name = "retail-ontology-platform"
version = "0.1.0"
description = "Retail Ontology Platform - Monorepo for retail-ontology, retail-cli, retail-telegram, retail-api"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "ucimlrepo",
    "retail-ontology",
    "retail-cli",
    "retail-api",
    "retail-telegram",
]

[tool.uv.workspace]
members = [
    "packages/retail-ontology",
    "packages/retail-cli",
    "packages/retail-telegram",
    "packages/retail-api",
]

[tool.uv.sources]
retail-ontology = {workspace = true}
retail-cli = {workspace = true}
retail-telegram = {workspace = true}
retail-api = {workspace = true}

[project.optional-dependencies]
dev =  [
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "B", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "RUF", "SIM", "TID", "QF", "TD", "INT", "RET", "FLY", "PERF", "ISC", "ICN", "PIE", "PT", "REF", "RSE", "SLF", "SLOT", "TRY", "UP", "YTT"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN401", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "ERA001", "EXE005", "FBT001", "FBT002", "FBT003", "INP001", "ISC001", "ISC002", "ISC003", "PD011", "PERF401", "PIE796", "PLR0913", "PLW0602", "PLW0603", "PT004", "PT006", "PT012", "PT015", "RUF001", "RUF012", "RUF013", "S101", "S113", "S311", "S603", "S607", "SIM103", "SIM115", "SLF001", "SLOT000", "T201", "T203", "TCH001", "TCH002", "TCH003", "TRY003", "UP006", "UP007", "UP035", "YTT101", "YTT102"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["packages/retail-ontology/src", "packages/retail-cli/src", "packages/retail-telegram/src", "packages/retail-api/src"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
show_missing = true
skip_covered = true

[tool.pre-commit-hooks]
# This section is for reference; actual hooks are in .pre-commit-config.yaml
