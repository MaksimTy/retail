# Retail Ontology Platform - Pre-commit Configuration
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter (local)
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check . --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff-format
        entry: ruff format .
        language: system
        pass_filenames: false

  # MyPy - Static type checking (local)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy packages/retail-ontology/src packages/retail-cli/src packages/retail-telegram/src packages/retail-api/src
        language: system
        pass_filenames: false

  # Check for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # Bandit - Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, packages/, -ll, --skip=B101,B601]
        exclude: ^tests/

  # Check for secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Check for license headers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

# Configuration
default_stages: [manual]
fail_fast: false
