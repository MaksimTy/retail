# Retail Ontology Platform - Pre-commit Configuration
# Install: pre-commit install
# Run: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # MyPy - Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.7, pydantic-settings>=2.3, pyyaml>=6.0, networkx>=3.2, instructor>=1.3, openai>=1.30, duckdb>=1.0, loguru>=0.7, tenacity>=8.2, typer>=0.12, rich>=13.7, fastapi>=0.111, uvicorn>=0.30, python-telegram-bot>=21.0]
        args: [--strict, --show-error-codes, --pretty]

  # Check for common issues
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # Bandit - Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, packages/, -ll, --skip=B101,B601]
        exclude: ^tests/

  # Check for secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Ensure Python version
  - repo: https://github.com/asottile/pyproject-fmt
    rev: v2024.10.1
    hooks:
      - id: pyproject-fmt

  # Check for license headers
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

# Configuration
default_stages: [manual]
fail_fast: false